# Root directory Alembic configuration for Guardian X

[alembic]
# Path to migration scripts directory
script_location = backend/alembic

# Prepend backend to sys.path so app modules are discoverable
prepend_sys_path = backend

version_path_separator = os
output_encoding = utf-8

# sqlalchemy.url is dynamically overridden in backend/alembic/env.py from backend/app/core/config.py
sqlalchemy.url = sqlite+aiosqlite:///./backend/guardianx.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
